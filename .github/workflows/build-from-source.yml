name: Build FongMi TV 5.8.9 fully from source (custom Media3 AARs)

# True from-source build of the official FongMi TV 5.8.9:
#   Stage 1 - compile a FongMi-compatible custom Media3 into 20 lib-*-release.aar
#   Stage 2 - compile official FongMi/TV fongmi branch (versionCode 589) against those AARs
#
# Media3 source: Diaojiangjun/media @ release-1.11.0-fongmi (synced from
# FongMi/media@release-1.11.0-fongmi, plus the 2026-11-19 commits that add the
# FongMi TV playback APIs (DecoderMode / DiscMenu* / Subtitle* / MpvPlayer etc.)
# and unified FFmpeg/mpv natives needed by TV 5.8.9). Official FongMi/media has
# not published these classes for 5.8.9, so this is the matching public source.
#
# This avoids Maven entirely: upstream app/build.gradle loads AARs from app/libs
# via fileTree. The AARs already ship ONE unified libffmpeg.so (jniUnified2 /
# jniUnified), so TV's verify*MpvNative checks pass without any native patching.

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      create_release:
        description: 'Publish built APK to a GitHub Release'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANGER" ] && [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          echo "sdk.dir=$ANDROID_HOME" > "$HOME/local.properties"

      # ---------- Stage 1: custom Media3 AARs (full 5.8.9 playback APIs) ----------
      - name: Clone custom Media3 with 5.8.9 APIs (Diaojiangjun/media)
        run: |
          git clone --depth 1 --branch release-1.11.0-fongmi https://github.com/Diaojiangjun/media.git /tmp/media
          echo "Media3 commit: $(git -C /tmp/media rev-parse HEAD)"
          git -C /tmp/media log -3 --oneline
          # sanity check: the playback API classes TV 5.8.9 needs must exist
          for c in \
            libraries/common/src/main/java/androidx/media3/common/DecoderMode.java \
            libraries/common/src/main/java/androidx/media3/common/DiscMenuController.java \
            libraries/common/src/main/java/androidx/media3/common/text/SubtitleContent.java \
            libraries/mpvplayer/src/main/java/androidx/media3/mpvplayer/MpvPlayer.java; do
            if [ -f "/tmp/media/$c" ]; then echo "OK $c"; fi
          done
          test -f /tmp/media/libraries/common/src/main/java/androidx/media3/common/DecoderMode.java \
            || { echo "ERROR: DecoderMode missing in Media3 source"; exit 1; }
          test -f /tmp/media/libraries/common/src/main/java/androidx/media3/common/DiscMenuController.java \
            || { echo "ERROR: DiscMenuController missing in Media3 source"; exit 1; }
          test -f /tmp/media/libraries/mpvplayer/src/main/java/androidx/media3/mpvplayer/MpvPlayer.java \
            || { echo "ERROR: MpvPlayer missing in Media3 source"; exit 1; }

      - name: Patch PlayerView.getVideoBounds (needed by TV 5.8.9 mobile)
        run: |
          # TV 5.8.9's TouchInput calls PlayerView.getVideoBounds(). This fork's
          # PlayerView has the transform APIs but not getVideoBounds; another
          # FongMi media fork (dlgt7) has it. Inject the same implementation.
          python3 - <<'PY'
          import base64
          p = '/tmp/media/libraries/ui/src/main/java/androidx/media3/ui/PlayerView.java'
          s = open(p, encoding='utf-8').read()
          if 'getVideoBounds' not in s:
              if 'import android.graphics.RectF;' not in s:
                  s = s.replace('import android.graphics.Rect;',
                                'import android.graphics.Rect;\nimport android.graphics.RectF;', 1)
              method = base64.b64decode(
                  ''
              ).decode('utf-8')
              anchor = '  /** Returns the current video scale and pan transform. */'
              assert anchor in s, 'anchor getVideoTransform not found'
              s = s.replace(anchor, method + anchor, 1)
              open(p, 'w', encoding='utf-8').write(s)
              print('Injected getVideoBounds into PlayerView.java')
          assert 'getVideoBounds' in open(p, encoding='utf-8').read()
          PY

      - name: Build custom Media3 AARs
        run: |
          cd /tmp/media
          cp "$HOME/local.properties" ./local.properties
          chmod +x gradlew
          # The Gradle plugin portal occasionally returns a bad POM; retry a few times.
          OK=0
          for attempt in 1 2 3; do
            echo "=== assembleRelease attempt $attempt ==="
            if ./gradlew assembleRelease --no-daemon --stacktrace; then OK=1; break; fi
            sleep 30
          done
          test "$OK" = "1" || { echo "ERROR: assembleRelease failed after 3 attempts"; exit 1; }
          echo "===== built AARs ====="
          find . -name 'lib-*-release.aar' -type f | sort
          AAR_COUNT=$(find . -name 'lib-*-release.aar' -type f | wc -l)
          echo "AAR count: $AAR_COUNT"
          test "$AAR_COUNT" -ge 15 || { echo "ERROR: too few AARs"; exit 1; }
          mkdir -p /tmp/custom-aars
          # The official build copies ONLY the 20 AARs listed in move.txt into
          # app/libs. Copying every lib-*-release.aar pulls in GMS-dependent
          # modules (lib-exoplayer-ima) and duplicate UI libs that break the
          # resource link. Follow move.txt exactly.
          grep -vE '^\s*(#|$)' move.txt | while read -r aar_name; do
            f=$(find . -name "$aar_name" -type f | head -1)
            test -n "$f" || { echo "ERROR: move.txt AAR not built: $aar_name"; exit 1; }
            cp "$f" /tmp/custom-aars/
          done
          echo "AARs copied per move.txt: $(ls /tmp/custom-aars/*.aar | wc -l)"
          ls -lh /tmp/custom-aars/
          echo "===== unified native check ====="
          python3 - <<'PY'
          import zipfile
          for aar in ['/tmp/custom-aars/lib-decoder-ffmpeg-release.aar',
                      '/tmp/custom-aars/lib-mpvplayer-release.aar']:
              with zipfile.ZipFile(aar) as z:
                  so=[n for n in z.namelist() if n.startswith('jni/') and n.endswith('.so')]
              print(aar.split('/')[-1], 'native entries:', len(so))
              for n in sorted(so): print('  ', n)
          PY

      # ---------- Stage 2: official 5.8.9 source ----------
      - name: Clone official FongMi TV 5.8.9 source (fongmi branch)
        run: |
          git clone --depth 1 --branch fongmi https://github.com/FongMi/TV.git /tmp/tv
          echo "TV commit: $(git -C /tmp/tv rev-parse HEAD)"
          grep -E 'versionName|versionCode' /tmp/tv/app/build.gradle | head -4

      - name: Assemble source into workspace
        run: |
          cd /tmp/tv
          rm -rf .git .github
          cp -a . "$GITHUB_WORKSPACE"/
          cd "$GITHUB_WORKSPACE"
          echo "Source files: $(find . -type f | wc -l)"

      - name: Allow official-signed runtime modules (self-built main app)
        run: |
          python3 -c "import base64;exec(base64.b64decode('').decode('utf-8'))"

      - name: Place custom Media3 AARs into app/libs
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p app/libs
          cp -v /tmp/custom-aars/*.aar app/libs/
          echo "app/libs AARs: $(find app/libs -name '*.aar' | wc -l)"

      - name: Recreate gradle-wrapper.properties
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          chmod +x gradlew

      - name: Generate signing keystore and local.properties
        run: |
          cd "$GITHUB_WORKSPACE"
          echo "" | base64 -d > app/release.jks
          keytool -list -keystore app/release.jks -storepass android123 2>&1 | head -5
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          storeFile=release.jks
          keyAlias=fongmi
          storePassword=android123
          keyPassword=android123
          EOF
          echo "local.properties written"

      - name: Build APK from source
        run: |
          cd "$GITHUB_WORKSPACE"
          BT="${{ inputs.build_type }}"
          TASK="assemble${BT}"
          echo "Running ./gradlew $TASK"
          ./gradlew "$TASK" --no-daemon --stacktrace

      - name: Collect APKs
        id: collect
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p dist
          find app/build/outputs -name '*.apk' -type f | while read f; do cp "$f" dist/; done
          echo "===== APKs ====="
          ls -lh dist/
          echo "===== sha256 ====="
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
          test -n "$(ls dist/*.apk 2>/dev/null)" || { echo "ERROR: no APK produced"; exit 1; }

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fongmi-5.8.9-from-source
          path: dist/*
          if-no-files-found: error

      - name: Create Release
        if: ${{ inputs.create_release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          TAG="from-source-5.8.9-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
            --title "FongMi TV 5.8.9 (built from source)" \
            --notes "Compiled from official FongMi/TV fongmi branch (versionCode 589) against custom Media3 AARs (Diaojiangjun/media release-1.11.0-fongmi, with 5.8.9 playback APIs and unified FFmpeg/mpv natives). Self-built with a FIXED keystore (repeatable builds). Patched runtime signer check to accept official-signed modules, so all 6 official runtime modules install and work. Not byte-identical to the official APK." \
            --repo "$GITHUB_REPOSITORY"
