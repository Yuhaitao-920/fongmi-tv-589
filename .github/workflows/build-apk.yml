name: Build FongMi TV 5.8.9 APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: true
        default: 'MobileArm64_v8a'
        type: choice
        options:
          - MobileArm64_v8a
          - MobileArmeabi_v7a
          - LeanbackArm64_v8a
          - LeanbackArmeabi_v7a
          - all
      create_release:
        description: 'Create a GitHub Release with the APK'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify source version
        run: |
          grep -E 'versionName|versionCode' app/build.gradle | head -4
          echo "Media3 aar count: $(find third_party/maven -name '*.aar' | wc -l)"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Recreate gradle-wrapper.properties
        run: |
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          chmod +x gradlew
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Generate signing keystore and local.properties
        run: |
          keytool -genkeypair -v -keystore app/release.jks \
            -alias fongmi -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=FongMiRebuild, OU=Build, O=Rebuild, L=NA, ST=NA, C=CN" > /dev/null 2>&1
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          storeFile=release.jks
          keyAlias=fongmi
          storePassword=android123
          keyPassword=android123
          EOF
          echo "local.properties written"

      - name: Discover assemble tasks
        run: |
          echo "===== available assemble tasks ====="
          ./gradlew tasks --all --no-daemon 2>&1 | grep -iE '^assemble|assemble[A-Z]' | sort -u | head -60 || true

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        id: collect
        run: |
          mkdir -p dist
          find app/build/outputs -name '*.apk' -type f | while read f; do
            cp "$f" dist/
          done
          echo "===== APKs ====="
          ls -lh dist/
          if [ -z "$(ls -A dist)" ]; then
            echo "ERROR: no APK produced"; exit 1
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fongmi-tv-589-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Create Release
        if: ${{ inputs.create_release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v5.8.9-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/*.apk \
            --title "FongMi TV 5.8.9 rebuild" \
            --notes "Rebuilt from official FongMi/TV fongmi branch (5.8.9, versionCode 589) with bundled custom Media3. Debug-signed." \
            --repo "$GITHUB_REPOSITORY"
