name: Build FongMi TV from source (auto-follow upstream)

# One-click build that follows the official FongMi/TV source:
#   - Stage 1: compile a FongMi-compatible custom Media3 into the 20 lib-*-release.aar
#   - Stage 2: compile the official FongMi/TV source against those AARs
#
# To follow an official upgrade:
#   1)点击 Run workflow。默认 tv_ref=fongmi（官方分支 HEAD，升级后即为新版本）。
#   2)版本号从 app/build.gradle 自动读取，Release tag/title 自动带版本号。
#   3)如果官方换了 Media3 播放 API，前置检查会给出提示，需用 media_ref 指向匹配的新 fork。
#   4)签名校验补丁带容错：上游改了那行代码也不会让构建失败，只会警告模块可能不兼容。

on:
  workflow_dispatch:
    inputs:
      tv_ref:
        description: 'FongMi/TV 源码 ref（分支/tag/commit，默认 fongmi=官方最新）'
        required: true
        default: 'fongmi'
        type: string
      media_ref:
        description: '定制 Media3 分支（官方换播放 API 时才需改）'
        required: true
        default: 'release-1.11.0-fongmi'
        type: string
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      create_release:
        description: 'Publish built APK to a GitHub Release'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          echo "sdk.dir=$ANDROID_HOME" > "$HOME/local.properties"

      # ---------- Stage 2a (early): clone upstream TV source, detect version ----------
      - name: Clone official FongMi TV source
        run: |
          REF="${{ inputs.tv_ref }}"
          git clone --depth 1 --branch "$REF" https://github.com/FongMi/TV.git /tmp/tv 2>/dev/null \
            || { git clone --filter=blob:none https://github.com/FongMi/TV.git /tmp/tv && git -C /tmp/tv checkout "$REF"; }
          echo "TV ref: $REF"
          echo "TV commit: $(git -C /tmp/tv rev-parse HEAD)"
          git -C /tmp/tv log -1 --format='%ci %s'

      - name: Detect version and check Media3 compatibility
        run: |
          python3 - <<'PY'
          import re, os
          s = open('/tmp/tv/app/build.gradle', encoding='utf-8').read()
          v = re.search(r'versionName\s+["\']([^"\']+)["\']', s)
          c = re.search(r'versionCode\s+(\d+)', s)
          ver = v.group(1) if v else 'unknown'
          code = c.group(1) if c else '0'
          print('Detected upstream version: %s (versionCode %s)' % (ver, code))
          # Show the media3 dependency lines so a version bump is visible at a glance
          for line in s.splitlines():
              if 'media3' in line.lower() or 'fongmi' in line.lower() and 'implementation' in line:
                  print('  dep:', line.strip()[:160])
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('TV_VERSION=%s\nTV_CODE=%s\n' % (ver, code))
          PY
          echo "Media3 fork ref: ${{ inputs.media_ref }}"
          echo ">>> If upstream bumped Media3/playback APIs, set media_ref to a matching fork. <<<"

      # ---------- Stage 1: custom Media3 AARs ----------
      - name: Clone custom Media3 with TV playback APIs
        run: |
          git clone --depth 1 --branch "${{ inputs.media_ref }}" https://github.com/Diaojiangjun/media.git /tmp/media
          echo "Media3 commit: $(git -C /tmp/media rev-parse HEAD)"
          for c in \
            libraries/common/src/main/java/androidx/media3/common/DecoderMode.java \
            libraries/common/src/main/java/androidx/media3/common/DiscMenuController.java \
            libraries/common/src/main/java/androidx/media3/common/text/SubtitleContent.java \
            libraries/mpvplayer/src/main/java/androidx/media3/mpvplayer/MpvPlayer.java; do
            test -f "/tmp/media/$c" || { echo "ERROR: missing $c (Media3 fork does not match this TV version)"; exit 1; }
            echo "OK $c"
          done

      - name: Patch PlayerView.getVideoBounds
        run: |
          python3 - <<'PY'
          import base64
          p = '/tmp/media/libraries/ui/src/main/java/androidx/media3/ui/PlayerView.java'
          s = open(p, encoding='utf-8').read()
          if 'getVideoBounds' in s:
              print('already present')
          else:
              method = base64.b64decode('').decode('utf-8')
              if 'import android.graphics.RectF;' not in s:
                  s = s.replace('import android.graphics.Rect;',
                                'import android.graphics.Rect;\nimport android.graphics.RectF;', 1)
              anchors = ['  /** Returns the current video scale and pan transform. */',
                         '  /** Returns the current video scale and pan transform */']
              a = next((x for x in anchors if x in s), None)
              if a:
                  s = s.replace(a, method + a, 1)
                  open(p, 'w', encoding='utf-8').write(s)
                  print('Injected getVideoBounds')
              else:
                  print('WARN: getVideoBounds anchor not found; build may fail if TV needs it')
          PY

      - name: Build custom Media3 AARs
        run: |
          cd /tmp/media
          cp "$HOME/local.properties" ./local.properties
          chmod +x gradlew
          OK=0
          for attempt in 1 2 3; do
            echo "=== assembleRelease attempt $attempt ==="
            EXTRA=""
            [ "$attempt" -gt 1 ] && EXTRA="--refresh-dependencies"
            if ./gradlew assembleRelease --no-daemon --stacktrace $EXTRA; then OK=1; break; fi
            sleep 30
          done
          test "$OK" = "1" || { echo "ERROR: assembleRelease failed after 3 attempts"; exit 1; }
          AAR_COUNT=$(find . -name 'lib-*-release.aar' -type f | wc -l)
          echo "AAR count: $AAR_COUNT"
          test "$AAR_COUNT" -ge 15 || { echo "ERROR: too few AARs"; exit 1; }
          mkdir -p /tmp/custom-aars
          grep -vE '^\s*(#|$)' move.txt | while read -r aar_name; do
            f=$(find . -name "$aar_name" -type f | head -1)
            test -n "$f" || { echo "ERROR: move.txt AAR not built: $aar_name"; exit 1; }
            cp "$f" /tmp/custom-aars/
          done
          echo "AARs copied: $(ls /tmp/custom-aars/*.aar | wc -l)"

      - name: Assemble source into workspace
        run: |
          cd /tmp/tv
          rm -rf .git .github
          cp -a . "$GITHUB_WORKSPACE"/
          cd "$GITHUB_WORKSPACE"
          echo "Source files: $(find . -type f | wc -l)"

      - name: Allow official-signed runtime modules (robust patch)
        run: |
          python3 -c "import base64;exec(base64.b64decode('').decode('utf-8'))"

      - name: Disable R8 stripping + keep MPV JNI callbacks
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 -c "import base64;exec(base64.b64decode('').decode('utf-8'))"
          echo '=== gradle minify lines ==='
          grep -n 'minifyEnabled\|shrinkResources' app/build.gradle
          echo '=== keep rules tail ==='
          tail -8 app/proguard-rules.pro

      - name: Place custom Media3 AARs into app/libs
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p app/libs
          cp -v /tmp/custom-aars/*.aar app/libs/
          echo "app/libs AARs: $(find app/libs -name '*.aar' | wc -l)"

      - name: Recreate gradle-wrapper.properties
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          chmod +x gradlew

      - name: Generate signing keystore and local.properties
        run: |
          cd "$GITHUB_WORKSPACE"
          echo "" | base64 -d > app/release.jks
          keytool -list -keystore app/release.jks -storepass android123 2>&1 | head -5
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          storeFile=release.jks
          keyAlias=fongmi
          storePassword=android123
          keyPassword=android123
          EOF
          echo "local.properties written"

      - name: Build APK from source
        run: |
          cd "$GITHUB_WORKSPACE"
          TASK="assemble${{ inputs.build_type }}"
          echo "Running ./gradlew $TASK (version $TV_VERSION / $TV_CODE)"
          ./gradlew "$TASK" --no-daemon --stacktrace || ./gradlew "$TASK" --no-daemon --stacktrace --refresh-dependencies

      - name: Collect APKs
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p dist
          find app/build/outputs -name '*.apk' -type f | while read f; do cp "$f" dist/; done
          ls -lh dist/
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
          test -n "$(ls dist/*.apk 2>/dev/null)" || { echo "ERROR: no APK produced"; exit 1; }

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fongmi-${{ env.TV_VERSION }}-from-source
          path: dist/*
          if-no-files-found: error

      - name: Create Release
        if: ${{ inputs.create_release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          TAG="from-source-${TV_VERSION}-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
            --title "FongMi TV ${TV_VERSION} (built from source)" \
            --notes "Auto-follow build from official FongMi/TV @ ${{ inputs.tv_ref }} (version \${TV_VERSION}, versionCode \${TV_CODE}) against custom Media3 AARs @ ${{ inputs.media_ref }}. Self-built with a FIXED keystore (repeatable builds). Runtime signer check patched to accept official-signed modules. Not byte-identical to the official APK." \
            --repo "$GITHUB_REPOSITORY"
