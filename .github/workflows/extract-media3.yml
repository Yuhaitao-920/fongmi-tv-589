name: Extract Media3 custom classes from official 5.8.9 APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download official 5.8.9 APK
        run: |
          curl -L --retry 3 -o official.apk \
            https://github.com/FongMi/Release/releases/download/5.8.9/mobile-arm64_v8a.apk
          ls -lh official.apk
          echo "md5: $(md5sum official.apk | cut -d' ' -f1)"

      - name: Setup dex2jar
        run: |
          rm -rf /tmp/d2j && mkdir -p /tmp/d2j
          curl -L -o /tmp/dex2jar.zip \
            https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-v2.4.zip
          unzip -o -q /tmp/dex2jar.zip -d /tmp/d2j
          D2J=$(find /tmp/d2j -name 'd2j-dex2jar.sh' | head -1)
          echo "D2J=$D2J"
          chmod +x "$(dirname "$D2J")"/*.sh
          echo "D2J_PATH=$D2J" >> $GITHUB_ENV

      - name: Convert dex files to jars
        run: |
          rm -rf /tmp/dexout && mkdir -p /tmp/dexout
          unzip -o -q official.apk 'classes*.dex' -d /tmp/dexout
          ls -lh /tmp/dexout/
          for d in /tmp/dexout/*.dex; do
            echo "Converting $d ..."
            "$D2J_PATH" -f "$d" -o "${d%.dex}.jar" >/dev/null 2>&1 || echo "convert failed for $d"
          done
          ls -lh /tmp/dexout/*.jar 2>/dev/null || echo "NO JARS PRODUCED"

      - name: Extract androidx.media3 classes into one jar
        run: |
          python3 - <<'PY'
          import zipfile, glob, os, shutil
          shutil.rmtree('extract_root', ignore_errors=True)
          os.makedirs('extract_root', exist_ok=True)
          count = 0
          for jar in glob.glob('/tmp/dexout/*.jar'):
              with zipfile.ZipFile(jar) as z:
                  for name in z.namelist():
                      if name.startswith('androidx/media3/') and not name.endswith('/'):
                          data = z.read(name)
                          out = os.path.join('extract_root', name)
                          os.makedirs(os.path.dirname(out), exist_ok=True)
                          with open(out, 'wb') as f:
                              f.write(data)
                          count += 1
          print('media3 entries extracted:', count)
          # diagnostic: list all entries containing media3 / MediaChapter across jars
          import glob as g
          for jar in g.glob('/tmp/dexout/*.jar'):
              with zipfile.ZipFile(jar) as z:
                  names=z.namelist()
                  m3=[n for n in names if 'media3' in n.lower()]
                  mc=[n for n in names if 'MediaChapter' in n or 'DecoderMode' in n or 'DolbyVision' in n]
                  print('JAR',os.path.basename(jar),'total',len(names),'media3-ish',len(m3),'keyhits',mc[:8])
          for key in ['MediaChapter.class','DecoderMode.class','DolbyVisionOutputPolicy.class',
                      'DiscMenuController.class','DiscMenuState.class','SubtitleContent.class',
                      'SubtitleOffsets.class','SubtitleSelectionState.class','MediaEdition.class']:
              matches=[]
              for root,_,files in os.walk('extract_root'):
                  if key in files: matches.append(os.path.join(root,key))
              print(' ',key,'=>', ('FOUND '+str(matches[0]) if matches else 'MISSING'))
          # build jar with python to include all nested classes
          with zipfile.ZipFile('app/libs/media3-official.jar','w',zipfile.ZIP_DEFLATED) as outz:
              for root,_,files in os.walk('extract_root/androidx/media3'):
                  for fn in files:
                      full=os.path.join(root,fn)
                      arc=os.path.relpath(full,'extract_root')
                      outz.write(full,arc)
          print('jar size:', os.path.getsize('app/libs/media3-official.jar'))
          PY
          ls -lh app/libs/media3-official.jar

      - name: Switch build config to use extracted media3 jar
        run: |
          python3 - <<'PY'
          # app/build.gradle: remove bundled media3 bundle, add the jar via fileTree (already included)
          p='app/build.gradle'
          s=open(p,encoding='utf-8').read()
          s=s.replace('    implementation libs.bundles.media3\n','')
          # remove media3 version forcing (may point to bundled version)
          s=s.replace("            eachDependency { details ->\n                if (details.requested.group == 'androidx.media3') {\n                    details.useVersion(libs.versions.media3.get())\n                }\n            }\n",'\n')
          # fileTree must include jar too
          s=s.replace('include: ["*.aar"]', 'include: ["*.aar", "*.jar"]')
          open(p,'w',encoding='utf-8').write(s)
          print('media3 bundle removed:', 'libs.bundles.media3' not in s)
          print('fileTree line:', [l.strip() for l in s.splitlines() if 'fileTree' in l])
          PY

      - name: Commit extracted media3 jar and config
        run: |
          # remove any temp artifacts accidentally committed earlier
          rm -rf dexout extract_root dex2jar dex2jar.zip official.apk
          git config user.name "Yuhaitao-920"
          git config user.email "Yuhaitao-920@users.noreply.github.com"
          git add -A
          git add -f app/libs/media3-official.jar
          git commit -m "Extract official 5.8.9 Media3 custom classes into local jar" || echo "nothing to commit"
          git push origin HEAD:main
