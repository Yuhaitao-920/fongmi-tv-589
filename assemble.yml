name: Assemble FongMi TV 5.8.9 official source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Clone official FongMi/TV fongmi branch (5.8.9)
        run: |
          git clone --depth 1 --branch fongmi https://github.com/FongMi/TV.git /tmp/upstream
          echo "UPSTREAM_COMMIT=$(git -C /tmp/upstream rev-parse HEAD)" >> $GITHUB_ENV
          grep -E 'versionName|versionCode' /tmp/upstream/app/build.gradle | head -4

      - name: Clone webhtv for bundled custom Media3 aar
        run: |
          git clone --depth 1 https://github.com/Yuhaitao-920/webhtv.git /tmp/webhtv

      - name: Copy official source into repo (excluding vcs)
        run: |
          cd /tmp/upstream
          rm -rf .git
          cp -a . "$GITHUB_WORKSPACE"/
          cd "$GITHUB_WORKSPACE"
          echo "Copied upstream source. File count:"
          find . -type f | wc -l

      - name: Copy bundled custom Media3 maven repo
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p third_party
          cp -a /tmp/webhtv/third_party/maven third_party/maven
          echo "Maven aar count:"
          find third_party/maven -name '*.aar' | wc -l

      - name: Patch gradle wrapper properties (gitignored upstream)
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          # ensure gradlew executable
          chmod +x gradlew

      - name: Patch settings.gradle to include bundled maven
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          p = 'settings.gradle'
          s = open(p, encoding='utf-8').read()
          if 'third_party/maven' not in s:
              s = s.replace(
                  '        mavenCentral()\n        google()\n        flatDir { dirs "$rootDir/app/libs" }',
                  '        maven { url = uri("$rootDir/third_party/maven") }\n        mavenCentral()\n        google()\n        flatDir { dirs "$rootDir/app/libs" }',
                  1)
          open(p, 'w', encoding='utf-8').write(s)
          print('settings.gradle patched:', 'third_party/maven' in s)
          PY

      - name: Patch libs.versions.toml with Media3 declarations
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          p = 'gradle/libs.versions.toml'
          s = open(p, encoding='utf-8').read()
          if 'media3 = ' not in s:
              # add version under [versions]
              s = s.replace('media = "1.8.0"',
                            'media = "1.8.0"\nmedia3 = "1.11.0-alpha01-fongmi"', 1)
              libs = '''
          media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
          media3-container = { group = "androidx.media3", name = "media3-container", version.ref = "media3" }
          media3-database = { group = "androidx.media3", name = "media3-database", version.ref = "media3" }
          media3-datasource = { group = "androidx.media3", name = "media3-datasource", version.ref = "media3" }
          media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }
          media3-datasource-rtmp = { group = "androidx.media3", name = "media3-datasource-rtmp", version.ref = "media3" }
          media3-decoder = { group = "androidx.media3", name = "media3-decoder", version.ref = "media3" }
          media3-effect = { group = "androidx.media3", name = "media3-effect", version.ref = "media3" }
          media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
          media3-exoplayer-dash = { group = "androidx.media3", name = "media3-exoplayer-dash", version.ref = "media3" }
          media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
          media3-exoplayer-rtsp = { group = "androidx.media3", name = "media3-exoplayer-rtsp", version.ref = "media3" }
          media3-exoplayer-smoothstreaming = { group = "androidx.media3", name = "media3-exoplayer-smoothstreaming", version.ref = "media3" }
          media3-extractor = { group = "androidx.media3", name = "media3-extractor", version.ref = "media3" }
          media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
          media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
          media3-ui-danmaku = { group = "androidx.media3", name = "media3-ui-danmaku", version.ref = "media3" }
          '''
              # insert before [plugins] section
              s = s.replace('\n[plugins]', '\n' + libs + '\n[plugins]', 1)
              bundle = 'media3 = ["media3-common", "media3-container", "media3-database", "media3-datasource", "media3-datasource-okhttp", "media3-datasource-rtmp", "media3-decoder", "media3-effect", "media3-exoplayer", "media3-exoplayer-dash", "media3-exoplayer-hls", "media3-exoplayer-rtsp", "media3-exoplayer-smoothstreaming", "media3-extractor", "media3-session", "media3-ui", "media3-ui-danmaku"]\n'
              if '[bundles]' in s:
                  s = s.replace('[bundles]\n', '[bundles]\n' + bundle, 1)
              else:
                  s += '\n[bundles]\n' + bundle
          open(p, 'w', encoding='utf-8').write(s)
          print('media3 version declared:', 'media3 = "1.11.0-alpha01-fongmi"' in s)
          PY

      - name: Patch app/build.gradle with Media3 dependency and version forcing
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          p = 'app/build.gradle'
          s = open(p, encoding='utf-8').read()
          # force media3 version in resolutionStrategy
          if 'androidx.media3' not in s:
              s = s.replace(
                  '            force libs.okhttp\n',
                  '            force libs.okhttp\n            eachDependency { details ->\n                if (details.requested.group == \'androidx.media3\') {\n                    details.useVersion(libs.versions.media3.get())\n                }\n            }\n',
                  1)
          # add media3 bundle dependency
          if 'libs.bundles.media3' not in s:
              s = s.replace(
                  '    implementation libs.media\n',
                  '    implementation libs.media\n    implementation libs.bundles.media3\n',
                  1)
          open(p, 'w', encoding='utf-8').write(s)
          print('media3 dep added:', 'libs.bundles.media3' in s)
          PY

      - name: Commit assembled source
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "Yuhaitao-920"
          git config user.email "Yuhaitao-920@users.noreply.github.com"
          git add -A
          git commit -m "Assemble FongMi TV 5.8.9 official source with bundled Media3 (upstream $UPSTREAM_COMMIT)" || echo "nothing to commit"
          git push origin HEAD:main
          echo "ASSEMBLED_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
